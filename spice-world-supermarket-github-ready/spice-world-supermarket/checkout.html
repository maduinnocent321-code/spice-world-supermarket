<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | Spice World Supermarket</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            <h2>Spice World</h2>
            <span>Supermarket</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="offers.html">Offers</a>
<a href="delivery.html">Delivery</a>
<a href="contact.html">Contact</a>
        </nav>

        <a href="cart.html" class="basket">
            🛒 Basket <span id="cart-count">0</span>
        </a>

    </header>


    <section class="shop-hero">

        <p class="section-label">CHECKOUT</p>

        <h1>Complete your order</h1>

        <p>
            Enter your delivery details below.
        </p>

    </section>


    <section class="checkout-section">

        <form id="checkout-form">

            <div class="checkout-box">

                <h2>Contact Details</h2>

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        required
                    >

                </div>

            </div>


            <div class="checkout-box">

                <h2>Delivery Address</h2>

                <div class="form-group">

                    <label for="address">
                        Address
                    </label>

                    <input
                        type="text"
                        id="address"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="city">
                        Town / City
                    </label>

                    <input
                        type="text"
                        id="city"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="postcode">
                        Postcode
                    </label>

                    <input
                        type="text"
                        id="postcode"
                        required
                    >

                </div>

            </div>


            <div class="checkout-box">

                <h2>Delivery Method</h2>

                <label class="radio-option">

                    <input
                        type="radio"
                        name="delivery"
                        value="standard"
                        checked
                    >

                    Standard Delivery — £3.99

                </label>


                <label class="radio-option">

                    <input
                        type="radio"
                        name="delivery"
                        value="collection"
                    >

                    Collect from Store — FREE

                </label>

            </div>


            <div class="checkout-box">

                <h2>Payment Method</h2>

                <label class="radio-option">

                    <input
                        type="radio"
                        name="payment"
                        value="card"
                        checked
                    >

                    💳 Card Payment

                </label>


                <label class="radio-option">

                    <input
                        type="radio"
                        name="payment"
                        value="cash"
                    >

                    💷 Cash on Delivery

                </label>

            </div>


            <button
                type="submit"
                class="place-order-button"
            >
                Place Order
            </button>

        </form>


        <div class="checkout-summary">

    <h2>Your Order</h2>

            <div id="checkout-items"></div>

            <div class="summary-row">
                <span>Subtotal</span>

                <span id="checkout-subtotal">
                    £0.00
                </span>
            </div>

            <div class="summary-row">
                <span>Delivery</span>

                <span id="checkout-delivery">
                    £0.00
                </span>
            </div>

            <div class="summary-row total-row">
                <span>Total</span>

                <span id="checkout-total">
                    £0.00
                </span>
            </div>

        </div>

    </section>

    <script
        type="module"
        src="js/checkout.js"
    ></script>

</body>

</html>
