<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Spice World Supermarket</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <section class="login-section">

        <div class="login-box">

            <p class="section-label">ADMIN</p>

            <h1>Admin Login</h1>

            <p>
                Sign in to manage customer orders.
            </p>

            <form id="admin-login-form">

                <label for="admin-email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="admin-email"
                    required
                >

                <label for="admin-password">
                    Password
                </label>

                <input
                    type="password"
                    id="admin-password"
                    required
                >

                <button type="submit">
                    Sign In
                </button>

                <p id="login-message"></p>

            </form>

        </div>

    </section>

    <script
        type="module"
        src="js/admin-login.js">
    </script>

</body>

</html>
