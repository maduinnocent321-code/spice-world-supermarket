<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Your Basket | Spice World Supermarket
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>


<body>


    <header class="header">

        <div class="logo">

            <h2>
                Spice World
            </h2>

            <span>
                Supermarket
            </span>

        </div>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="shop.html">
                Shop
            </a>

            <a href="offers.html">Offers</a>
<a href="delivery.html">Delivery</a>
<a href="contact.html">Contact</a>

        </nav>


        <a
            href="cart.html"
            class="basket"
        >
            🛒 Basket
            <span id="cart-count">
                0
            </span>
        </a>

    </header>



    <section class="shop-hero">

        <p class="section-label">
            YOUR ORDER
        </p>

        <h1>
            Your Basket
        </h1>

        <p>
            Review your items before checkout.
        </p>

    </section>



    <section class="cart-section">


        <div id="cart-items"></div>


        <div class="cart-summary">

            <h2>
                Order Summary
            </h2>


            <div class="summary-row">

                <span>
                    Subtotal
                </span>

                <span id="subtotal">
                    £0.00
                </span>

            </div>


            <div class="summary-row">

                <span>
                    Delivery
                </span>

                <span id="delivery">
                    £0.00
                </span>

            </div>


            <div class="summary-row total-row">

                <span>
                    Total
                </span>

                <span id="total">
                    £0.00
                </span>

            </div>


            <a
                href="checkout.html"
                class="checkout-button"
                id="checkout-button"
            >
                Proceed to Checkout
            </a>

        </div>


    </section>



    <script src="js/cart.js"></script>


</body>

</html>
