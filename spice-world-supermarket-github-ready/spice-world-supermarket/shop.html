<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shop | Spice World Supermarket</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            <h2>Spice World</h2>
            <span>Supermarket</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="offers.html">Offers</a>
<a href="delivery.html">Delivery</a>
<a href="contact.html">Contact</a>
        </nav>

        <a href="cart.html" class="basket">
            🛒 Basket <span id="cart-count">0</span>
        </a>

    </header>


    <section class="shop-hero">

        <p class="section-label">ONLINE SHOP</p>

        <h1>Shop your favourite groceries</h1>

        <p>
            Browse Indian, African, Asian and continental food,
            fresh produce and everyday essentials.
        </p>

    </section>


    <section class="shop-section">

        <div class="shop-topbar">

            <input
                type="text"
                id="search"
                placeholder="Search products..."
            >

            <select id="category-filter">
                <option value="all">All Categories</option>
                <option value="rice">Rice & Grains</option>
                <option value="spices">Spices</option>
                <option value="fresh">Fresh Produce</option>
                <option value="frozen">Frozen Foods</option>
                <option value="drinks">Drinks</option>
            </select>

        </div>


        <div class="product-grid" id="product-grid">

            <p>Loading products...</p>

        </div>

    </section>


    <script type="module" src="js/shop.js"></script>

</body>

</html>
